<!doctype html>
<html lang="en">
	<body style="margin: 0; padding: 0; background: #000000">
		<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #000000">
			<tr>
				<td align="center" style="padding: 40px 16px">
					<table
						role="presentation"
						width="100%"
						cellpadding="0"
						cellspacing="0"
						style="
							max-width: 520px;
							background: #0d0d0d;
							border: 1px solid #333333;
							font-family: Inter, 'Segoe UI', Ubuntu, Arial, sans-serif;
							color: #f2f2f2;
						"
					>
						<tr>
							<td style="padding: 32px">
								<p style="margin: 0 0 24px; font-size: 14px; letter-spacing: 1px; color: #a6a6a6">
									MINTMVP CONSOLE
								</p>
								<h1 style="margin: 0 0 16px; font-size: 24px; line-height: 1.3; color: #ffffff">
									Reset your password
								</h1>
								<p style="margin: 0 0 24px; font-size: 16px; line-height: 1.6; color: #d9d9d9">
									Someone asked to reset the password for {{ .Email }}. Press the button below to
									choose a new one.
								</p>
								<p style="margin: 0 0 24px">
									<a
										href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/reset"
										style="
											display: inline-block;
											padding: 14px 24px;
											background: #ffffff;
											color: #000000;
											font-size: 16px;
											font-weight: 600;
											text-decoration: none;
										"
										>Choose a new password</a
									>
								</p>
								<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #a6a6a6">
									If you did not ask for this, you can ignore this email. Your password will stay the
									same.
								</p>
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
